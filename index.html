            //Math.ceil() округляет число вверх, то есть к ближайшему целому числу, которое не меньше исходного.
            console.log(Math.ceil(3.1)); //4

            //Math.abs() возвращает абсолютное значение числа, то есть расстояние числа от нуля без учёта знака
            Math.abs(-6);//6

            //Math.floor() округляет число вниз, то есть к ближайшему целому числу, которое не больше исходного числа
            Math.floor(4.8); // 4

            //Функция round() округляет число до следующего наименьшего целого числа, если его десятичная часть меньше 0.5. Если же десятичная часть равна или больше 0.5, то округление идёт до ближайшего наибольшего целого числа

              //дробная часть меньше 0.5 → округляем вниз
              //дробная часть 0.5 или больше → округляем вверх

              Math.round(4.2); // 4
              Math.round(4.6); // 5

              //Math.pow() возводит число в определённую степень
              Math.pow(число, степень)
              Math.pow(2, 3);//8

              //Math.sqrt() квадратный корень — это число, которое нужно умножить само на себя, чтобы получить исходное число.
              Math.sqrt(9);//3

              
              // Math.min() — ищет самое маленькое число

             Допустим, у нас есть несколько чисел:

             Math.min(5, 2, 8, 1, 10);

             8

             10
